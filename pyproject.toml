[project]
name = "protein-language-models-from-first-principles"
version = "0.1.0"
description = "Educational protein language models built from first principles"
readme = "README.md"
authors = [
    { name = "Jose Alvarado Alvarenga" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "torch>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_lm"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
